notify = ["/Users/kubo/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

# Auto Mode 相当: サンドボックス内は自動承認・無許可で実行
# - ワークスペース内のファイル操作・コマンドは許可プロンプトなしで実行
# - サンドボックス外への書き込みやsudo等は自動拒否(セーフティネット)
approval_policy = "never"
sandbox_mode = "workspace-write"
sandbox_workspace_write.network_access = true
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
service_tier = "default"

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/kubo/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/kubo/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[features]
js_repl = false

[mcp_servers.node_repl]
command = "/Applications/ChatGPT Classic.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120.0

[mcp_servers.node_repl.env]
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.818.41705"
BROWSER_USE_TINYSKY_ENABLED = "0"
CODEX_CLI_PATH = "/Applications/ChatGPT Classic.app/Contents/Resources/codex"
CODEX_HOME = "/Users/kubo/.codex"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = "Control desktop apps on macOS through Computer Use."
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT Classic.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT Classic.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/kubo/.codex:/Applications/ChatGPT Classic.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/Users/kubo/.codex/plugins/cache/openai-bundled/browser/26.818.41705/scripts/browser-service.mjs","sky":"@oai/sky/service"}'

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[mcp_servers.hadron]
command = "/Users/kubo/.local/bin/hadron"
args = ["mcp", "serve"]

[desktop]
conversationDetailMode = "STEPS_PROSE"
ambient-suggestions-enabled = true

[desktop.open-in-target-preferences]
global = "zed"

[projects."/Users/kubo/Projects/coterium"]
trust_level = "trusted"

[projects."/Users/kubo/Projects/bootstrap"]
trust_level = "trusted"

[notice]
hide_rate_limit_model_nudge = true
